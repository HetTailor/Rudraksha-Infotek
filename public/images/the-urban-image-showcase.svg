<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="uiDarkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0d10" stop-opacity="0.85" />
      <stop offset="40%" stop-color="#0b0d10" stop-opacity="0.45" />
      <stop offset="75%" stop-color="#0b0d10" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#080a0d" stop-opacity="0.98" />
    </linearGradient>

    <linearGradient id="uiVignetteLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#090b0e" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#090b0e" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#090b0e" stop-opacity="0.2" />
    </linearGradient>

    <radialGradient id="goldAura" cx="80%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="goldBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e6ca65" />
      <stop offset="50%" stop-color="#c59b27" />
      <stop offset="100%" stop-color="#a67c1e" />
    </linearGradient>

    <linearGradient id="pillBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#9a7318" stop-opacity="0.3" />
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.75" />
    </filter>

    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Dark Canvas -->
  <rect width="1200" height="750" fill="#090b0e" />

  <!-- PHOTOGRAPHY HERO IMAGE (Indian Wedding Moments) -->
  <g id="hero-photo">
    <!-- Wedding Photograph of Indian Bride & Groom -->
    <image href="https://images.unsplash.com/photo-1583939003579-730e3918a45a?auto=format&amp;fit=crop&amp;w=1200&amp;q=80" x="0" y="46" width="1200" height="704" preserveAspectRatio="xMidYMid slice" opacity="0.88" />
    <!-- Gradient Overlays for High Legibility and Editorial Elegance -->
    <rect x="0" y="46" width="1200" height="704" fill="url(#uiDarkGrad)" />
    <rect x="0" y="46" width="650" height="704" fill="url(#uiVignetteLeft)" />
    <rect x="0" y="46" width="1200" height="704" fill="url(#goldAura)" />
  </g>

  <!-- ================= BROWSER WINDOW CHROME ================= -->
  <rect x="0" y="0" width="1200" height="46" fill="#0f1318" />
  <line x1="0" y1="46" x2="1200" y2="46" stroke="#1f2630" stroke-width="1" />

  <!-- macOS Window Dots -->
  <circle cx="28" cy="23" r="6" fill="#ef4444" />
  <circle cx="48" cy="23" r="6" fill="#f59e0b" />
  <circle cx="68" cy="23" r="6" fill="#10b981" />

  <!-- Browser Navigation Bar -->
  <rect x="360" y="10" width="480" height="26" rx="6" fill="#1a2029" stroke="#2d3748" stroke-width="1" />
  <!-- Lock Icon -->
  <g transform="translate(374, 16)">
    <rect x="1" y="5" width="10" height="8" rx="2" fill="#d4af37" />
    <path d="M3 5V3a3 3 0 0 1 6 0v2" stroke="#d4af37" stroke-width="1.5" fill="none" />
  </g>
  <text x="394" y="27" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" letter-spacing="0.2">
    https://www.theurbanimage.in
  </text>
  <text x="815" y="27" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11">
    ↻
  </text>

  <!-- ================= WEBSITE HEADER / NAVIGATION ================= -->
  <g transform="translate(60, 72)">
    <!-- Logo -->
    <g transform="translate(0, 2)">
      <text x="0" y="18" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700" letter-spacing="2.5">
        THE URBAN IMAGE
      </text>
      <text x="1" y="32" fill="#c59b27" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" letter-spacing="3">
        WEDDING PHOTOGRAPHY &amp; CINEMA
      </text>
    </g>

    <!-- Nav Items -->
    <g transform="translate(450, 18)" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" letter-spacing="1">
      <text x="0" y="0" fill="#ffffff">Stories</text>
      <text x="80" y="0" fill="#cbd5e1">Films</text>
      <text x="150" y="0" fill="#cbd5e1">Portfolio</text>
      <text x="245" y="0" fill="#cbd5e1">Experience</text>
      <text x="355" y="0" fill="#cbd5e1">About Us</text>
    </g>

    <!-- Header CTA Button -->
    <g transform="translate(930, 2)">
      <rect x="0" y="0" width="150" height="38" rx="19" fill="url(#goldBtn)" />
      <text x="75" y="24" fill="#0b0d10" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="0.5">
        Book Dates ✦
      </text>
    </g>
  </g>

  <!-- ================= HERO EDITORIAL CONTENT (LEFT) ================= -->
  <g transform="translate(60, 185)">
    <!-- Elegant Badge -->
    <rect x="0" y="0" width="290" height="30" rx="15" fill="#1b1d1f" stroke="url(#pillBorder)" stroke-width="1.2" />
    <circle cx="16" cy="15" r="4" fill="#e6ca65" />
    <text x="28" y="20" fill="#f3e8b5" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">
      TIMELESS MOMENTS • CANDID CINEMA
    </text>

    <!-- Headline in Editorial Serif -->
    <text x="0" y="78" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" letter-spacing="-0.5">
      Authentic Stories.
    </text>
    <text x="0" y="130" fill="#e6ca65" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="400" font-style="italic" letter-spacing="-0.5">
      Timeless Celebrations.
    </text>

    <!-- Description -->
    <text x="0" y="180" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="400" line-height="24">
      <tspan x="0" dy="0">Capturing the heartfelt joy, regal grandeur, and intimate candid glances</tspan>
      <tspan x="0" dy="25">of Indian weddings through bespoke editorial photography and films.</tspan>
    </text>

    <!-- Dual CTAs -->
    <g transform="translate(0, 248)">
      <!-- Primary Gold CTA -->
      <rect x="0" y="0" width="180" height="46" rx="23" fill="url(#goldBtn)" />
      <text x="90" y="28" fill="#0b0d10" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="0.2">
        Explore Stories →
      </text>

      <!-- Secondary Glass Button -->
      <rect x="195" y="0" width="165" height="46" rx="23" fill="#12171e" stroke="#334155" stroke-width="1.2" />
      <text x="277" y="28" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
        Watch Cinema Film
      </text>
    </g>

    <!-- Wedding Service Pillars -->
    <g transform="translate(0, 328)">
      <g transform="translate(0, 0)">
        <circle cx="10" cy="10" r="10" fill="#241e12" />
        <path d="M6 10L9 13L14 7" stroke="#e6ca65" stroke-width="2" stroke-linecap="round" fill="none" />
        <text x="26" y="14" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">
          Candid Wedding Moments
        </text>
      </g>
      <g transform="translate(180, 0)">
        <circle cx="10" cy="10" r="10" fill="#241e12" />
        <path d="M6 10L9 13L14 7" stroke="#e6ca65" stroke-width="2" stroke-linecap="round" fill="none" />
        <text x="26" y="14" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">
          Cinematic Wedding Films
        </text>
      </g>
      <g transform="translate(360, 0)">
        <circle cx="10" cy="10" r="10" fill="#241e12" />
        <path d="M6 10L9 13L14 7" stroke="#e6ca65" stroke-width="2" stroke-linecap="round" fill="none" />
        <text x="26" y="14" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">
          Destination Shoots
        </text>
      </g>
    </g>
  </g>

  <!-- ================= FLOATING EDITORIAL BADGES (RIGHT) ================= -->
  <g transform="translate(680, 160)">
    <!-- FLOATING CARD 1: CANDID MOMENTS -->
    <g transform="translate(190, 40)" filter="url(#softShadow)">
      <rect x="0" y="0" width="195" height="74" rx="16" fill="#0d1117" stroke="url(#pillBorder)" stroke-width="1.5" />
      <circle cx="28" cy="37" r="16" fill="#241e12" stroke="#d4af37" stroke-width="1.2" />
      <text x="28" y="42" fill="#e6ca65" font-size="14" text-anchor="middle">📷</text>
      <text x="56" y="32" fill="#ffffff" font-family="Georgia, serif" font-size="14" font-weight="700">
        Candid Moments
      </text>
      <text x="56" y="52" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" letter-spacing="0.5">
        AUTHENTIC EMOTIONS
      </text>
    </g>

    <!-- FLOATING CARD 2: CINEMATIC FILMS -->
    <g transform="translate(240, 240)" filter="url(#softShadow)">
      <rect x="0" y="0" width="180" height="74" rx="16" fill="#0d1117" stroke="url(#pillBorder)" stroke-width="1.5" />
      <circle cx="28" cy="37" r="16" fill="#241e12" stroke="#d4af37" stroke-width="1.2" />
      <text x="28" y="42" fill="#e6ca65" font-size="14" text-anchor="middle">🎬</text>
      <text x="56" y="32" fill="#ffffff" font-family="Georgia, serif" font-size="14" font-weight="700">
        Cinematic Films
      </text>
      <text x="56" y="52" fill="#e6ca65" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.5">
        4K VISUAL STORY
      </text>
    </g>
  </g>

  <!-- ================= BOTTOM EDITORIAL STRIP ================= -->
  <g transform="translate(60, 660)">
    <rect x="0" y="0" width="1080" height="54" rx="14" fill="#0d1117" stroke="#242b35" stroke-width="1" />

    <g transform="translate(30, 32)">
      <text x="0" y="0" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1">CURATED LOCATIONS</text>
      <text x="145" y="0" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Royal Palaces Udaipur • Heritage Jaipur • Destination Goa • Global</text>
    </g>

    <g transform="translate(680, 32)">
      <text x="0" y="0" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1">EXPERIENCE</text>
      <text x="95" y="0" fill="#e6ca65" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Large Photography Grid • Responsive UI • Emotional Flow</text>
    </g>
  </g>
</svg>
