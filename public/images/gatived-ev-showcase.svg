<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c0e" />
      <stop offset="50%" stop-color="#0b1519" />
      <stop offset="100%" stop-color="#050a0c" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="emeraldAura" cx="65%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.28" />
      <stop offset="50%" stop-color="#047857" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="accentBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="bikeFrameGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="35%" stop-color="#059669" />
      <stop offset="70%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="neonPulse" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="750" fill="url(#bgGrad)" />

  <!-- Ambient Light Effects -->
  <circle cx="780" cy="380" r="340" fill="url(#emeraldAura)" />
  <ellipse cx="600" cy="620" rx="460" ry="60" fill="url(#glowGrad)" />

  <!-- Subtle Grid Texture -->
  <g opacity="0.07" stroke="#10b981" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="220" x2="1200" y2="220" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="520" x2="1200" y2="520" />
    <line x1="0" y1="620" x2="1200" y2="620" />
    <line x1="180" y1="0" x2="180" y2="750" />
    <line x1="380" y1="0" x2="380" y2="750" />
    <line x1="580" y1="0" x2="580" y2="750" />
    <line x1="780" y1="0" x2="780" y2="750" />
    <line x1="980" y1="0" x2="980" y2="750" />
  </g>

  <!-- ================= BROWSER WINDOW CHROME ================= -->
  <rect x="0" y="0" width="1200" height="46" fill="#0f172a" />
  <line x1="0" y1="46" x2="1200" y2="46" stroke="#1e293b" stroke-width="1" />

  <!-- macOS Window Dots -->
  <circle cx="28" cy="23" r="6" fill="#ef4444" />
  <circle cx="48" cy="23" r="6" fill="#f59e0b" />
  <circle cx="68" cy="23" r="6" fill="#10b981" />

  <!-- Browser Navigation Bar -->
  <rect x="360" y="10" width="480" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <!-- Lock Icon -->
  <g transform="translate(374, 16)">
    <rect x="1" y="5" width="10" height="8" rx="2" fill="#10b981" />
    <path d="M3 5V3a3 3 0 0 1 6 0v2" stroke="#10b981" stroke-width="1.5" fill="none" />
  </g>
  <text x="394" y="27" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" letter-spacing="0.2">
    https://gativedev.com
  </text>
  <text x="815" y="27" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11">
    ↻
  </text>

  <!-- ================= WEBSITE HEADER / NAVIGATION ================= -->
  <g transform="translate(60, 70)">
    <!-- Logo -->
    <g transform="translate(0, 4)">
      <!-- Lightning Bolt Icon in Emerald Circle -->
      <circle cx="16" cy="14" r="16" fill="url(#accentBtn)" />
      <path d="M17 6L11 15H17L15 22L22 13H16L18 6Z" fill="#ffffff" />
      <text x="42" y="21" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" letter-spacing="1">
        GATIVED <tspan fill="#10b981">EV</tspan>
      </text>
    </g>

    <!-- Nav Items -->
    <g transform="translate(420, 18)" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">
      <text x="0" y="0" fill="#ffffff">E-Bikes</text>
      <text x="80" y="0" fill="#94a3b8">Features</text>
      <text x="170" y="0" fill="#94a3b8">Specifications</text>
      <text x="290" y="0" fill="#94a3b8">Test Ride</text>
      <text x="385" y="0" fill="#94a3b8">About Brand</text>
    </g>

    <!-- Header CTA Button -->
    <g transform="translate(930, 4)">
      <rect x="0" y="0" width="150" height="38" rx="19" fill="url(#accentBtn)" filter="url(#softGlow)" opacity="0.9" />
      <rect x="0" y="0" width="150" height="38" rx="19" fill="url(#accentBtn)" />
      <text x="75" y="24" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.3">
        Book Test Ride ⚡
      </text>
    </g>
  </g>

  <!-- ================= HERO CONTENT SECTION (LEFT) ================= -->
  <g transform="translate(60, 175)">
    <!-- Top Pill Badge -->
    <rect x="0" y="0" width="265" height="30" rx="15" fill="#064e3b" stroke="#059669" stroke-width="1.2" />
    <circle cx="16" cy="15" r="4" fill="#10b981" />
    <text x="28" y="20" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1">
      100% ELECTRIC MOBILITY • ZERO EMISSIONS
    </text>

    <!-- Headline -->
    <text x="0" y="75" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="900" letter-spacing="-0.5">
      Future of Urban Mobility
    </text>
    <text x="0" y="122" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="900" letter-spacing="-0.5">
      Engineered for India.
    </text>

    <!-- Description -->
    <text x="0" y="165" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" line-height="22">
      <tspan x="0" dy="0">Experience next-level electric performance with high-torque motors,</tspan>
      <tspan x="0" dy="24">aerodynamic styling, and smart IoT telemetry for every ride.</tspan>
    </text>

    <!-- Dual CTAs -->
    <g transform="translate(0, 230)">
      <!-- Primary CTA -->
      <rect x="0" y="0" width="180" height="46" rx="23" fill="url(#accentBtn)" />
      <text x="90" y="28" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
        Explore Electric Bikes
      </text>

      <!-- Secondary CTA -->
      <rect x="195" y="0" width="165" height="46" rx="23" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
      <text x="277" y="28" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
        Schedule Test Ride
      </text>
    </g>

    <!-- Trust Markers -->
    <g transform="translate(0, 310)">
      <g transform="translate(0, 0)">
        <circle cx="10" cy="10" r="10" fill="#064e3b" />
        <path d="M6 10L9 13L14 7" stroke="#10b981" stroke-width="2" stroke-linecap="round" fill="none" />
        <text x="26" y="14" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">
          Smart Battery Tech
        </text>
      </g>
      <g transform="translate(150, 0)">
        <circle cx="10" cy="10" r="10" fill="#064e3b" />
        <path d="M6 10L9 13L14 7" stroke="#10b981" stroke-width="2" stroke-linecap="round" fill="none" />
        <text x="26" y="14" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">
          Mobile App Connectivity
        </text>
      </g>
      <g transform="translate(325, 0)">
        <circle cx="10" cy="10" r="10" fill="#064e3b" />
        <path d="M6 10L9 13L14 7" stroke="#10b981" stroke-width="2" stroke-linecap="round" fill="none" />
        <text x="26" y="14" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">
          Home Charging Ready
        </text>
      </g>
    </g>
  </g>

  <!-- ================= ELECTRIC VEHICLE HERO SHOWCASE (RIGHT) ================= -->
  <g transform="translate(560, 140)">
    <!-- High-Tech Pedestal Platform -->
    <ellipse cx="320" cy="380" rx="280" ry="40" fill="#052e16" opacity="0.6" />
    <ellipse cx="320" cy="375" rx="250" ry="30" stroke="#10b981" stroke-width="2" fill="none" opacity="0.4" />
    <ellipse cx="320" cy="375" rx="220" ry="20" stroke="#34d399" stroke-width="1.5" stroke-dasharray="6 6" fill="none" opacity="0.6" />

    <!-- STYLIZED MODERN ELECTRIC MOTORCYCLE / E-BIKE VECTOR ARTWORK -->
    <g transform="translate(60, 40)">
      <!-- Ground Shadow -->
      <ellipse cx="260" cy="325" rx="210" ry="24" fill="#020617" opacity="0.8" />

      <!-- REAR WHEEL -->
      <g transform="translate(100, 270)">
        <!-- Tire -->
        <circle cx="0" cy="0" r="62" stroke="#1e293b" stroke-width="20" fill="none" />
        <circle cx="0" cy="0" r="64" stroke="#0f172a" stroke-width="4" fill="none" />
        <!-- Glowing Alloy Rim -->
        <circle cx="0" cy="0" r="46" stroke="#10b981" stroke-width="4" fill="#090d16" filter="url(#neonPulse)" />
        <circle cx="0" cy="0" r="46" stroke="#34d399" stroke-width="2.5" fill="#090d16" />
        <!-- Rim Spokes & Center Hub -->
        <line x1="-38" y1="0" x2="38" y2="0" stroke="#10b981" stroke-width="3" />
        <line x1="0" y1="-38" x2="0" y2="38" stroke="#10b981" stroke-width="3" />
        <line x1="-28" y1="-28" x2="28" y2="28" stroke="#10b981" stroke-width="2.5" />
        <line x1="-28" y1="28" x2="28" y2="-28" stroke="#10b981" stroke-width="2.5" />
        <circle cx="0" cy="0" r="16" fill="#1e293b" stroke="#34d399" stroke-width="2" />
        <circle cx="0" cy="0" r="6" fill="#10b981" />
      </g>

      <!-- FRONT WHEEL -->
      <g transform="translate(420, 270)">
        <!-- Tire -->
        <circle cx="0" cy="0" r="62" stroke="#1e293b" stroke-width="20" fill="none" />
        <circle cx="0" cy="0" r="64" stroke="#0f172a" stroke-width="4" fill="none" />
        <!-- Glowing Alloy Rim -->
        <circle cx="0" cy="0" r="46" stroke="#10b981" stroke-width="4" fill="#090d16" filter="url(#neonPulse)" />
        <circle cx="0" cy="0" r="46" stroke="#34d399" stroke-width="2.5" fill="#090d16" />
        <!-- Rim Spokes & Center Hub -->
        <line x1="-38" y1="0" x2="38" y2="0" stroke="#10b981" stroke-width="3" />
        <line x1="0" y1="-38" x2="0" y2="38" stroke="#10b981" stroke-width="3" />
        <line x1="-28" y1="-28" x2="28" y2="28" stroke="#10b981" stroke-width="2.5" />
        <line x1="-28" y1="28" x2="28" y2="-28" stroke="#10b981" stroke-width="2.5" />
        <circle cx="0" cy="0" r="16" fill="#1e293b" stroke="#34d399" stroke-width="2" />
        <circle cx="0" cy="0" r="6" fill="#10b981" />
      </g>

      <!-- SWINGARM & REAR DRIVE -->
      <path d="M100 270 L210 245 L225 260 L120 285 Z" fill="#334155" stroke="#1e293b" stroke-width="1.5" />
      <circle cx="210" cy="245" r="14" fill="#0f172a" stroke="#10b981" stroke-width="2" />

      <!-- CENTRAL ELECTRIC BATTERY POWERTRAIN PACK -->
      <rect x="180" y="185" width="130" height="80" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="2.5" />
      <!-- Battery Cooling Fins & Details -->
      <line x1="195" y1="200" x2="295" y2="200" stroke="#334155" stroke-width="3" stroke-linecap="round" />
      <line x1="195" y1="215" x2="295" y2="215" stroke="#334155" stroke-width="3" stroke-linecap="round" />
      <line x1="195" y1="230" x2="295" y2="230" stroke="#334155" stroke-width="3" stroke-linecap="round" />
      <line x1="195" y1="245" x2="295" y2="245" stroke="#334155" stroke-width="3" stroke-linecap="round" />
      <!-- Electric Core Emblem -->
      <circle cx="245" cy="225" r="18" fill="#064e3b" stroke="#34d399" stroke-width="2" filter="url(#softGlow)" />
      <path d="M246 216 L240 226 H246 L244 234 L251 224 H246 Z" fill="#ffffff" />

      <!-- MAIN AERODYNAMIC CHASSIS / FRAME -->
      <path d="M100 270 L190 170 L270 145 L360 145 L410 180 L420 270 L395 270 L350 180 L250 185 L180 270 Z" fill="url(#bikeFrameGrad)" stroke="#10b981" stroke-width="1.5" />

      <!-- TANK & SEAT CONTOUR -->
      <!-- Sculpted Top Fairing -->
      <path d="M150 175 C190 170 230 145 280 145 C330 145 370 160 380 175 L350 195 C310 175 250 175 190 195 Z" fill="#0f172a" stroke="#34d399" stroke-width="2" />
      <!-- Minimalist Ergonomic Saddle -->
      <path d="M140 175 C175 170 215 175 240 185 L230 195 C205 190 165 188 135 195 Z" fill="#1e293b" />
      <!-- Green Racing Stripe Accent -->
      <path d="M220 162 L350 162" stroke="#10b981" stroke-width="4" stroke-linecap="round" filter="url(#softGlow)" />

      <!-- FRONT FORK & STEERING SUSPENSION -->
      <line x1="365" y1="135" x2="420" y2="270" stroke="#94a3b8" stroke-width="7" stroke-linecap="round" />
      <line x1="365" y1="135" x2="420" y2="270" stroke="#047857" stroke-width="3" stroke-linecap="round" />

      <!-- HANDLEBARS & DIGITAL CLUSTER DISPLAY -->
      <path d="M350 135 L375 125 L390 130" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" fill="none" />
      <rect x="365" y="118" width="22" height="14" rx="3" fill="#020617" stroke="#10b981" stroke-width="1.5" />
      <circle cx="376" cy="125" r="3" fill="#34d399" />

      <!-- DUAL LED PROJECTOR HEADLIGHT -->
      <polygon points="380,165 410,172 385,185" fill="#10b981" filter="url(#softGlow)" />
      <!-- Projected Light Beam -->
      <polygon points="410,172 520,130 540,240 405,185" fill="url(#glowGrad)" opacity="0.75" />
    </g>

    <!-- FLOATING FEATURE BADGE 1: RANGE -->
    <g transform="translate(10, 80)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="145" height="64" rx="14" fill="#0b131b" stroke="#10b981" stroke-width="1.5" />
      <text x="18" y="28" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900">
        160 KM
      </text>
      <text x="18" y="48" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" letter-spacing="0.5">
        EXTENDED RANGE
      </text>
    </g>

    <!-- FLOATING FEATURE BADGE 2: QUICK CHARGE -->
    <g transform="translate(380, 50)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="145" height="64" rx="14" fill="#0b131b" stroke="#34d399" stroke-width="1.5" />
      <text x="18" y="28" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900">
        45 MIN
      </text>
      <text x="18" y="48" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" letter-spacing="0.5">
        FAST CHARGING
      </text>
    </g>

    <!-- FLOATING FEATURE BADGE 3: SPEED -->
    <g transform="translate(360, 310)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="150" height="64" rx="14" fill="#0b131b" stroke="#10b981" stroke-width="1.5" />
      <text x="18" y="28" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900">
        85 <tspan font-size="13" fill="#10b981">KM/H</tspan>
      </text>
      <text x="18" y="48" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" letter-spacing="0.5">
        TOP SPEED
      </text>
    </g>
  </g>

  <!-- ================= BOTTOM SPECIFICATION STRIP ================= -->
  <g transform="translate(60, 660)">
    <rect x="0" y="0" width="1080" height="54" rx="14" fill="#091017" stroke="#1e293b" stroke-width="1" />

    <g transform="translate(30, 32)">
      <text x="0" y="0" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">MODEL FLEET</text>
      <text x="95" y="0" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Gatived E-Motion • Gatived Sport-X • Gatived City Rider</text>
    </g>

    <g transform="translate(620, 32)">
      <text x="0" y="0" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">TECH STACK</text>
      <text x="85" y="0" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Responsive Web UI • Product Showcase • Interactive Test Ride</text>
    </g>
  </g>
</svg>
