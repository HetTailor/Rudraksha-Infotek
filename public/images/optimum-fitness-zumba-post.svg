<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" fill="none">
  <defs>
    <!-- Dark Studio Photo Vignette and Shading -->
    <linearGradient id="photoLeftShade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.9" />
      <stop offset="38%" stop-color="#05070a" stop-opacity="0.75" />
      <stop offset="68%" stop-color="#090d14" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="photoBottomShade" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.95" />
      <stop offset="30%" stop-color="#000000" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="redBottomBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="50%" stop-color="#ea384c" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glowDarkOutline" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="3" flood-color="#000000" flood-opacity="0.95" />
    </filter>
    <filter id="redClassDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="6" stdDeviation="3" flood-color="#000000" flood-opacity="0.98" />
    </filter>
  </defs>

  <!-- 1. Full-bleed Gym Photo: Energetic Woman Dancing in Gym -->
  <image href="https://images.unsplash.com/photo-1518611012118-696072aa579a?auto=format&amp;fit=crop&amp;w=1200&amp;q=85" x="-20" y="0" width="1120" height="1080" preserveAspectRatio="xMidYMid slice" />

  <!-- Shading & Lighting -->
  <rect x="0" y="0" width="1080" height="1080" fill="url(#photoLeftShade)" />
  <rect x="0" y="500" width="1080" height="580" fill="url(#photoBottomShade)" />
  <circle cx="850" cy="300" r="260" fill="#f59e0b" opacity="0.12" />

  <!-- 2. TOP-LEFT: OPTIMUM FITNESS LOGO -->
  <g transform="translate(48, 48)">
    <!-- Concentric Swirl / Arc Logo in Coral Red -->
    <g transform="translate(50, 50)">
      <!-- Outer Arc -->
      <path d="M-36 -22 C-16 -40 20 -40 40 -22 C56 -5 52 28 30 46 C14 58 -10 58 -26 46" fill="none" stroke="#ea384c" stroke-width="7" stroke-linecap="round" />
      <!-- Middle Arc -->
      <path d="M-24 -10 C-11 -24 14 -24 26 -10 C38 4 36 24 20 34 C6 42 -10 42 -20 32" fill="none" stroke="#ea384c" stroke-width="7" stroke-linecap="round" />
      <!-- Center Solid / Dot Core -->
      <circle cx="0" cy="6" r="8" fill="#ea384c" />
    </g>

    <!-- Brand Wordmark Typography -->
    <g transform="translate(120, 42)">
      <text x="0" y="0" fill="#ffffff" font-family="'Montserrat', 'Arial Black', system-ui, sans-serif" font-size="34" font-weight="900" letter-spacing="1.5">
        OPTIMUM
      </text>
      <text x="2" y="28" fill="#ffffff" font-family="'Montserrat', system-ui, sans-serif" font-size="24" font-weight="700" letter-spacing="9">
        FITNESS
      </text>
    </g>
  </g>

  <!-- 3. TOP-RIGHT: CORAL RED DOT MATRIX (7 columns x 5 rows) -->
  <g transform="translate(860, 48)">
    <g fill="#ea384c">
      <!-- 7 columns, 5 rows -->
      <circle cx="0" cy="0" r="5.5" /><circle cx="25" cy="0" r="5.5" /><circle cx="50" cy="0" r="5.5" /><circle cx="75" cy="0" r="5.5" /><circle cx="100" cy="0" r="5.5" /><circle cx="125" cy="0" r="5.5" /><circle cx="150" cy="0" r="5.5" />
      <circle cx="0" cy="20" r="5.5" /><circle cx="25" cy="20" r="5.5" /><circle cx="50" cy="20" r="5.5" /><circle cx="75" cy="20" r="5.5" /><circle cx="100" cy="20" r="5.5" /><circle cx="125" cy="20" r="5.5" /><circle cx="150" cy="20" r="5.5" />
      <circle cx="0" cy="40" r="5.5" /><circle cx="25" cy="40" r="5.5" /><circle cx="50" cy="40" r="5.5" /><circle cx="75" cy="40" r="5.5" /><circle cx="100" cy="40" r="5.5" /><circle cx="125" cy="40" r="5.5" /><circle cx="150" cy="40" r="5.5" />
      <circle cx="0" cy="60" r="5.5" /><circle cx="25" cy="60" r="5.5" /><circle cx="50" cy="60" r="5.5" /><circle cx="75" cy="60" r="5.5" /><circle cx="100" cy="60" r="5.5" /><circle cx="125" cy="60" r="5.5" /><circle cx="150" cy="60" r="5.5" />
      <circle cx="0" cy="80" r="5.5" /><circle cx="25" cy="80" r="5.5" /><circle cx="50" cy="80" r="5.5" /><circle cx="75" cy="80" r="5.5" /><circle cx="100" cy="80" r="5.5" /><circle cx="125" cy="80" r="5.5" /><circle cx="150" cy="80" r="5.5" />
    </g>
  </g>

  <!-- 4. HERO HEADLINE: FREE FOR ALL / ZUMBA / CLASS -->
  <g transform="translate(64, 250)">
    <!-- "FREE FOR ALL" in slanted/italic bold white with dark outline -->
    <text x="0" y="0" fill="#ffffff" font-family="'Impact', 'Arial Black', system-ui, sans-serif" font-size="58" font-weight="900" font-style="italic" letter-spacing="2" filter="url(#glowDarkOutline)">
      FREE FOR ALL
    </text>

    <!-- "ZUMBA" in massive bold white block typography -->
    <text x="0" y="130" fill="#ffffff" font-family="'Impact', 'Arial Black', 'Montserrat', sans-serif" font-size="142" font-weight="900" letter-spacing="-2" filter="url(#glowDarkOutline)">
      ZUMBA
    </text>

    <!-- "CLASS" in massive bold coral-red block typography -->
    <text x="0" y="270" fill="#ea384c" font-family="'Impact', 'Arial Black', 'Montserrat', sans-serif" font-size="150" font-weight="900" letter-spacing="-2" filter="url(#redClassDrop)">
      CLASS
    </text>
  </g>

  <!-- 5. EVENT SCHEDULE: DATE & TIME WITH ICONS -->
  <g transform="translate(64, 595)">
    <!-- Date Row -->
    <g transform="translate(0, 0)">
      <!-- Calendar Icon -->
      <g stroke="#ffffff" stroke-width="4.5" fill="none">
        <rect x="0" y="0" width="50" height="46" rx="7" />
        <line x1="0" y1="16" x2="50" y2="16" />
        <line x1="10" y1="-6" x2="10" y2="6" stroke-linecap="round" />
        <line x1="40" y1="-6" x2="40" y2="6" stroke-linecap="round" />
        <!-- Days -->
        <circle cx="12" cy="27" r="2.8" fill="#ffffff" stroke="none" />
        <circle cx="25" cy="27" r="2.8" fill="#ffffff" stroke="none" />
        <circle cx="38" cy="27" r="2.8" fill="#ffffff" stroke="none" />
        <circle cx="12" cy="36" r="2.8" fill="#ffffff" stroke="none" />
        <circle cx="25" cy="36" r="2.8" fill="#ffffff" stroke="none" />
      </g>
      <!-- Date Text in Coral Red -->
      <text x="72" y="36" fill="#ea384c" font-family="'Montserrat', 'Arial Black', system-ui, sans-serif" font-size="44" font-weight="900" letter-spacing="1">
        02 APRIL, 2025
      </text>
    </g>

    <!-- Time Row -->
    <g transform="translate(0, 95)">
      <!-- Clock Icon -->
      <g stroke="#ffffff" stroke-width="4.5" fill="none">
        <circle cx="25" cy="25" r="24" />
        <polyline points="25,11 25,25 35,25" stroke-linecap="round" stroke-linejoin="round" />
      </g>
      <!-- Time Text (07:00 AM / 09:00 AM in Coral Red) -->
      <text x="72" y="26" fill="#ea384c" font-family="'Montserrat', 'Arial Black', system-ui, sans-serif" font-size="38" font-weight="900" letter-spacing="1">
        07:00 AM
      </text>
      <text x="72" y="66" fill="#ea384c" font-family="'Montserrat', 'Arial Black', system-ui, sans-serif" font-size="38" font-weight="900" letter-spacing="1">
        09:00 AM
      </text>
    </g>
  </g>

  <!-- 6. MOTIVATIONAL TAGLINE -->
  <g transform="translate(64, 830)">
    <text x="0" y="0" fill="#ffffff" font-family="'Montserrat', system-ui, sans-serif" font-size="30" font-weight="900" letter-spacing="1.5">
      JOIN OUR FUN AND ENERGETIC
    </text>
    <text x="0" y="44" fill="#ffffff" font-family="'Montserrat', system-ui, sans-serif" font-size="32" font-weight="900" letter-spacing="1.5">
      ZUMBA CLASSES!
    </text>
  </g>

  <!-- 7. BOTTOM-RIGHT DOT MATRIX (10 columns x 4 rows) -->
  <g transform="translate(775, 835)">
    <g fill="#ea384c">
      <!-- 4 Rows of 10 Dots -->
      <circle cx="0" cy="0" r="5" /><circle cx="24" cy="0" r="5" /><circle cx="48" cy="0" r="5" /><circle cx="72" cy="0" r="5" /><circle cx="96" cy="0" r="5" /><circle cx="120" cy="0" r="5" /><circle cx="144" cy="0" r="5" /><circle cx="168" cy="0" r="5" /><circle cx="192" cy="0" r="5" /><circle cx="216" cy="0" r="5" />
      <circle cx="0" cy="18" r="5" /><circle cx="24" cy="18" r="5" /><circle cx="48" cy="18" r="5" /><circle cx="72" cy="18" r="5" /><circle cx="96" cy="18" r="5" /><circle cx="120" cy="18" r="5" /><circle cx="144" cy="18" r="5" /><circle cx="168" cy="18" r="5" /><circle cx="192" cy="18" r="5" /><circle cx="216" cy="18" r="5" />
      <circle cx="0" cy="36" r="5" /><circle cx="24" cy="36" r="5" /><circle cx="48" cy="36" r="5" /><circle cx="72" cy="36" r="5" /><circle cx="96" cy="36" r="5" /><circle cx="120" cy="36" r="5" /><circle cx="144" cy="36" r="5" /><circle cx="168" cy="36" r="5" /><circle cx="192" cy="36" r="5" /><circle cx="216" cy="36" r="5" />
      <circle cx="0" cy="54" r="5" /><circle cx="24" cy="54" r="5" /><circle cx="48" cy="54" r="5" /><circle cx="72" cy="54" r="5" /><circle cx="96" cy="54" r="5" /><circle cx="120" cy="54" r="5" /><circle cx="144" cy="54" r="5" /><circle cx="168" cy="54" r="5" /><circle cx="192" cy="54" r="5" /><circle cx="216" cy="54" r="5" />
    </g>
  </g>

  <!-- 8. BOTTOM RED RIBBON / FOOTER STRIP (FULL WIDTH) -->
  <g transform="translate(0, 975)">
    <rect x="0" y="0" width="1080" height="105" fill="url(#redBottomBar)" />

    <!-- Address with Location Pin -->
    <g transform="translate(36, 38)">
      <g fill="#ffffff">
        <path d="M12 0 C5.37 0 0 5.37 0 12 C0 21 12 31 12 31 C12 31 24 21 24 12 C24 5.37 18.63 0 12 0 Z M12 16.5 C9.51 16.5 7.5 14.49 7.5 12 C7.5 9.51 9.51 7.5 12 7.5 C14.49 7.5 16.5 9.51 16.5 12 C16.5 14.49 14.49 16.5 12 16.5 Z" />
      </g>
      <text x="36" y="22" fill="#ffffff" font-family="'Montserrat', system-ui, sans-serif" font-size="22" font-weight="900" letter-spacing="0.4">
        4TH FLOOR KRISHNA ICON, TOWN HALL RD, ANAND, GUJARAT-388001
      </text>
    </g>

    <!-- Phone Numbers with Telephone Icon -->
    <g transform="translate(290, 78)">
      <g fill="#ffffff">
        <path d="M6.2 1.2 C5.5 -0.4 3.6 -0.4 2.8 0.5 L0.7 2.6 C-0.25 3.5 -0.25 5.3 0.77 7.7 C2.5 11.8 5.7 16.7 9.8 20.1 C12.2 21.2 14 21.2 14.9 20.2 L17 18.1 C17.9 17.3 17.9 15.4 16.3 14.7 L13.2 13.3 C12.1 12.8 10.7 13.3 10 14.4 L9.2 15.5 C6.6 13.9 5.3 10.9 3.6 8.2 L4.8 7.4 C5.9 6.7 6.4 5.4 5.9 4.3 L4.5 1.2 Z" />
      </g>
      <text x="30" y="19" fill="#ffffff" font-family="'Montserrat', system-ui, sans-serif" font-size="23" font-weight="900" letter-spacing="1">
        +91-7203098888, +91-7203058888
      </text>
    </g>
  </g>
</svg>
